<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Claude Profiles</title>
		<link rel="stylesheet" href="popup.css" />
		<script type="module" src="popup.js"></script>
	</head>
	<body>
		<section>
			<h1>Profiles</h1>
			<p id="profiles-error" class="error" hidden></p>
			<ul id="profiles" class="rows"></ul>
			<p class="status"><span id="status" hidden></span> <button id="reload" type="button" class="link">Reload extension</button></p>
		</section>
		<section>
			<h1>claude.ai tab account</h1>
			<p class="helper">Changes the claude.ai login in this profile's tabs. Claude in Chrome keeps its own login.</p>
			<form id="save-form" class="save">
				<input id="label" name="label" type="text" placeholder="Label" maxlength="64" required />
				<button type="submit">Save current</button>
			</form>
			<button id="sign-in-another" type="button">Sign in another account</button>
			<p class="helper">Save the current account first; this signs the tabs out locally without logging the saved session out.</p>
			<p id="accounts-error" class="error" hidden></p>
			<button id="relogin" type="button" title="Claude Code drives this browser's Claude in Chrome to sign in by email link" hidden>Sign back in to signed-out accounts</button>
			<p id="relogin-active" class="relogin" hidden><span id="relogin-pending"></span> <button id="relogin-cancel" type="button" class="link">Cancel</button></p>
			<p id="relogin-result" class="helper" hidden></p>
			<ul id="accounts" class="rows"></ul>
		</section>
	</body>
</html>
